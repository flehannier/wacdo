server:
  port: 8080
  servlet:
    context-path: /api

spring:
  mvc:
    versioning:
      strategy: header
  application:
    name: wacdo
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://bdd-commune:3306/wacdo?zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC&allowPublicKeyRetrieval=TRUE&useSSL=false
    username: wacdo
    password: Wacdo@081280$
    hikari:
      connection-test-query: SELECT 1
      test-while-idle: true
  security:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: update   # update | validate | create | create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Logger SQL lisible
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace  # voir les valeurs bindées

