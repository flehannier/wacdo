 <app-generic-list-component
      title="Collaborateurs"
      [data]="collaborateurs"
      [columns]="columns"
      [actions]="actionsList"
      [searchable]="true"
      [paginated]="true"
      [pageSize]="10"
      [showAddButton]="true"
      (addClicked)="onAddCollaborateur()"
      (searchChanged)="onSearchChanged($event)"
  />
  
  <app-generic-modal-component 
      [errors]="errors"
      [show]="showModal"
      [title]="modalTitle"
      [fields]="formFields"
      [item]="selectedItem"
      [action]="modalAction"
      (close)="closeModal()"
    />
