<nav class="relative bg-sky-500 after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10">
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">

      <!-- LEFT -->
      <div class="flex items-center">

        <!-- Hamburger mobile -->
        <button
          class="sm:hidden mr-2 p-2 rounded-md text-white hover:bg-white/10"
          (click)="openMobileMenu()"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- Desktop menu -->
        <div class="hidden sm:block">
          <div class="flex space-x-4">
            <a routerLink="/accueil" routerLinkActive="bg-gray-950/50 text-white"
              class="rounded-md px-3 py-2 text-sm font-medium hover:bg-white/10">
              Accueil
            </a>
            <a routerLink="/collaborateur" routerLinkActive="bg-gray-950/50 text-white"
              class="rounded-md px-3 py-2 text-sm font-medium hover:bg-white/10">
              Collaborateurs
            </a>
            <a routerLink="/restaurant" routerLinkActive="bg-gray-950/50 text-white"
              class="rounded-md px-3 py-2 text-sm font-medium hover:bg-white/10">
              Restaurants
            </a>
            <a routerLink="/fonction" routerLinkActive="bg-gray-950/50 text-white"
              class="rounded-md px-3 py-2 text-sm font-medium hover:bg-white/10">
              Fonctions
            </a>
            <a routerLink="/affectation" routerLinkActive="bg-gray-950/50 text-white"
              class="rounded-md px-3 py-2 text-sm font-medium hover:bg-white/10">
              Affectations
            </a>
          </div>
        </div>
      </div>
<!-- RIGHT : Avatar -->
<div class="flex items-center relative">
  <!-- Bouton avatar -->
  <button
    (click)="toggleAvatarMenu()"
    class="flex items-center gap-2 rounded-full bg-white/10 px-3 py-1.5 hover:bg-white/20 transition"
  >
    <div class="w-8 h-8 bg-gradient-to-br from-blue-400 to-cyan-600 rounded-full flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
    </div>
    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 9l-7 7-7-7"/>
    </svg>
  </button>

  <!-- Dropdown avatar -->
@if(showAvatarMenu){

  <div class="absolute right-0 top-full mt-1 w-48 rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 z-50">
    <a  class="block px-4 py-2 text-sm hover:bg-gray-100 cursor-pointer"  routerLink="/profile" >
      Mon profil
    </a>
    <a class="block px-4 py-2 text-sm hover:bg-gray-100 cursor-pointer" (click)="logout()">
      Se déconnecter
    </a>
  </div>
}  
</div>
    </div>
  </div>

<!-- ✅ MOBILE FULLSCREEN MENU (EN DEHORS DU NAV) -->
@if (isMobileMenuOpen) {
  <div class="fixed inset-0 z-50 sm:hidden">

    <div
      class="absolute inset-0 bg-black/40 backdrop-blur-sm"
      (click)="closeMobileMenu()"
    ></div>

    <div class="absolute inset-0 bg-sky-600 text-white flex flex-col animate-slide-down">

      <div class="flex items-center justify-between px-4 h-16 border-b border-white/10">
        <span class="text-lg font-semibold">Menu</span>
        <button (click)="closeMobileMenu()" class="p-2 rounded-full hover:bg-white/10">
          ✕
        </button>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-3 text-lg">
        <a routerLink="/accueil" (click)="closeMobileMenu()" class="block rounded-xl px-4 py-3 hover:bg-white/10">Accueil</a>
        <a routerLink="/collaborateur" (click)="closeMobileMenu()" class="block rounded-xl px-4 py-3 hover:bg-white/10">Collaborateurs</a>
        <a routerLink="/restaurant" (click)="closeMobileMenu()" class="block rounded-xl px-4 py-3 hover:bg-white/10">Restaurants</a>
        <a routerLink="/fonction" (click)="closeMobileMenu()" class="block rounded-xl px-4 py-3 hover:bg-white/10">Fonctions</a>
        <a routerLink="/affectation" (click)="closeMobileMenu()" class="block rounded-xl px-4 py-3 hover:bg-white/10">Affectations</a>
      </nav>
    </div>
  </div>
}
