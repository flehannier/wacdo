<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Wacdo authentification</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
            @if(errors) {
            <span class="error-message">{{errors}}</span>
            }
            
            <div class="form-group">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input 
                formControlName="email"
                type="email" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                placeholder="your@email.com"
                />
                @if(loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']) {
                <span class="error-message">L'email est obligatoire</span>
                }
            </div>
            <div class="form-group">
                <label for="motDePasse">Mot de passe</label>
                <input 
                formControlName="motDePasse"
                type="password" 
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
                placeholder="••••••••"
                />
                @if(loginForm.get('motDePasse')?.touched && loginForm.get('motDePasse')?.errors?.['required']) {
                <span class="error-message">Le mot de password est obligatoire</span>
                }
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Valider
            </button>
        </form>
    </div>
</div>
